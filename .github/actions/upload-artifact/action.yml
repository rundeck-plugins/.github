name: Upload artifact
description: Pinned actions/upload-artifact for Rundeck plugins.

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Files to upload
    required: true
  if-no-files-found:
    description: What to do when no files match
    required: false
    default: warn
  retention-days:
    description: Days to keep the artifact
    required: false
    default: '90'

runs:
  using: composite
  steps:
    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
