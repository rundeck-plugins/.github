name: Security Scan (Reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        default: '17'
        type: string
      java-distribution:
        description: 'Java distribution to use'
        required: false
        default: 'zulu'
        type: string
      snyk-detection-depth:
        description: 'Snyk detection depth'
        required: false
        default: '10'
        type: string
      runs-on:
        description: 'Runner to use'
        required: false
        default: 'ubuntu-latest'
        type: string
    secrets:
      SNYK_TOKEN:
        description: 'Snyk authentication token'
        required: true
      SNYK_ORG_ID:
        description: 'Snyk organization ID'
        required: true

jobs:
  snyk_security:
    name: Snyk Security Scan
    runs-on: ${{ inputs.runs-on }}
    
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          
      - name: Install Snyk CLI
        run: |
          curl -Lo snyk https://github.com/snyk/cli/releases/latest/download/snyk-linux
          chmod +x snyk
          sudo mv snyk /usr/local/bin/
      
      - name: Verify Snyk installation
        run: snyk --version

      - name: Snyk Clear Config (logout)
        run: snyk config clear
          
      - name: Configure Snyk organization
        run: snyk config set org='${{ env.SNYK_ORG_ID }}'

      - name: Confirm Snyk Identity
        run: snyk whoami --experimental

      - name: Check for Python project
        id: check_python
        run: |
          # Snyk natively scans pip (requirements.txt) and Poetry (pyproject.toml + poetry.lock).
          # It does NOT scan PEP 621 / setuptools pyproject.toml or setup.py-only projects, so
          # those are installed and exported to a requirements.txt for Snyk to pick up.
          if [ -f "requirements.txt" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "python_kind=requirements" >> $GITHUB_OUTPUT
            echo "Found requirements.txt - Snyk scans this natively"
          elif [ -f "pyproject.toml" ] && [ -f "poetry.lock" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "python_kind=poetry" >> $GITHUB_OUTPUT
            echo "Found Poetry project - Snyk scans this natively"
          elif [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "python_kind=project" >> $GITHUB_OUTPUT
            echo "Found PEP 621/setuptools project - will export resolved deps for Snyk"
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
            echo "No Python manifest found - skipping Python setup"
          fi

      - name: Set up Python
        if: steps.check_python.outputs.has_python == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies (requirements.txt)
        if: steps.check_python.outputs.python_kind == 'requirements'
        run: |
          echo "Installing Python dependencies from requirements.txt"
          pip install -r requirements.txt

      - name: Install and export Python dependencies (pyproject.toml / setup.py)
        if: steps.check_python.outputs.python_kind == 'project'
        run: |
          echo "Installing project and resolving dependencies"
          pip install .
          echo "Exporting resolved dependencies to requirements.txt for Snyk"
          # Exclude the project's own local (file://) install so Snyk only sees real deps
          pip freeze | grep -v ' @ ' > requirements.txt
          echo "Generated requirements.txt:"
          cat requirements.txt
      - name: Run Snyk monitor (main/master branch only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: snyk monitor --all-projects --project-tags=GitHubTopic=category-distributed --detection-depth=${{ inputs.snyk-detection-depth }}
          
      - name: Skip monitor for feature branches
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: echo "Skipping monitor for feature branch (${{ github.ref }}) - no data sent to dashboard"
        
      - name: Test for vulnerabilities
        run: snyk test --all-projects --severity-threshold=high --detection-depth=${{ inputs.snyk-detection-depth }}